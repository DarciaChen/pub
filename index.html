<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Darcia · 工具庫</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg: #0d1117; --surface: #161b22; --border: #21262d; --border-hi: #30363d;
      --text: #e6edf3; --muted: #7d8590; --accent: #58a6ff;
      --tag-html: #f78166; --tag-gh: #58a6ff; --tag-script: #7ee787;
      --tag-firebase: #e3b341; --tag-link: #bc8cff;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; min-height: 100vh; padding: 28px 16px 60px; }

    header { max-width: 720px; margin: 0 auto 28px; display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
    .logo { font-family: 'JetBrains Mono', monospace; font-weight: 600; font-size: 20px; color: var(--accent); }
    .logo span { color: var(--muted); }
    .subtitle { font-size: 12px; color: var(--muted); margin-top: 4px; }
    .count { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--muted); }

    /* Filter tabs */
    .filters { max-width: 720px; margin: 0 auto 20px; display: flex; gap: 8px; flex-wrap: wrap; }
    .filter-btn {
      font-size: 12px; font-family: 'JetBrains Mono', monospace;
      padding: 5px 12px; border-radius: 20px; border: 1px solid var(--border);
      background: transparent; color: var(--muted); cursor: pointer; transition: all 0.15s;
    }
    .filter-btn:hover { border-color: var(--border-hi); color: var(--text); }
    .filter-btn.active { background: var(--accent); border-color: var(--accent); color: #0d1117; font-weight: 600; }

    /* Sections */
    .sections { max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 26px; }
    .section-header {
      display: flex; align-items: baseline; gap: 8px; margin-bottom: 10px; padding: 0 2px;
    }
    .section-title { font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 600; color: var(--text); }
    .section-count {
      font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--muted);
      background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 1px 8px;
    }

    /* List */
    .list { display: flex; flex-direction: column; gap: 8px; }

    .item {
      background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
      padding: 15px 18px; display: flex; align-items: center; gap: 14px;
      text-decoration: none; color: inherit; transition: border-color 0.15s;
    }
    .item:hover { border-color: var(--accent); }
    .item.hidden { display: none; }

    .tag {
      font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 600;
      padding: 3px 7px; border-radius: 5px; flex-shrink: 0; min-width: 64px; text-align: center;
    }
    .tag-html     { background: #f7816622; color: var(--tag-html); }
    .tag-script   { background: #7ee78722; color: var(--tag-script); }
    .tag-firebase { background: #e3b34122; color: var(--tag-firebase); }
    .tag-link     { background: #bc8cff22; color: var(--tag-link); }

    .info { flex: 1; overflow: hidden; }
    .name { font-size: 14px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .meta { font-size: 11px; color: var(--muted); font-family: 'JetBrains Mono', monospace; margin-top: 3px; }
    .arrow { color: var(--muted); font-size: 16px; flex-shrink: 0; }

    .empty { text-align: center; color: var(--muted); padding: 60px 0; font-size: 13px; display: none; }
    .empty.show { display: block; }
  </style>
</head>
<body>

<div id="lock-screen" style="position:fixed;inset:0;background:#0e1117;z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px;">
  <div style="max-width:300px;width:100%;text-align:center;">
    <div style="font-size:16px;font-weight:700;margin-bottom:4px;">darcia / 工具庫</div>
    <div style="font-size:12px;color:#8896b3;margin-bottom:22px;">已鎖定，請輸入密碼解鎖</div>
    <input id="lock-pw" type="password" style="text-align:center;font-size:18px;margin-bottom:8px;width:100%;box-sizing:border-box;padding:12px;border-radius:8px;border:1px solid #2a3347;background:#1e2535;color:#e2e8f0;" placeholder="密碼" autocomplete="off" autocorrect="off" autocapitalize="off">
    <div id="lock-err" style="color:#ff6b6b;font-size:12px;height:16px;margin-bottom:8px;"></div>
    <button id="lock-btn" style="width:100%;background:#f5a623;color:#000;font-weight:700;border:none;border-radius:8px;padding:13px;font-size:15px;cursor:pointer;">解鎖</button>
  </div>
</div>

<div id="app-root" style="display:none;">

<header>
  <div>
    <div class="logo">darcia<span>/</span>工具庫</div>
    <div class="subtitle">所有 Claude 產出的工具與頁面</div>
  </div>
  <div class="count" id="count"></div>
</header>

<div class="filters">
  <button class="filter-btn active" data-filter="all">全部</button>
  <button class="filter-btn" data-filter="work">業務／工作</button>
  <button class="filter-btn" data-filter="music">音樂／語言</button>
  <button class="filter-btn" data-filter="life">生活／娛樂</button>
</div>

<div class="sections" id="sections"></div>
<div class="empty" id="empty">沒有符合的項目</div>

</div>

<script>
// ===== 密碼鎖定設定 =====
var LOCK_PASSWORD="8888";
var LOCK_REMEMBER_SESSION=true;
function unlockApp(){
  document.getElementById('lock-screen').style.display='none';
  document.getElementById('app-root').style.display='';
}
function tryUnlock(){
  var input=document.getElementById('lock-pw');
  if(input.value===LOCK_PASSWORD){
    if(LOCK_REMEMBER_SESSION){
      try{sessionStorage.setItem('pub_index_unlocked','1');}catch(e){}
    }
    unlockApp();
  }else{
    document.getElementById('lock-err').textContent='密碼錯誤，請再試一次';
    input.value='';
    input.focus();
  }
}
document.getElementById('lock-btn').onclick=tryUnlock;
document.getElementById('lock-pw').addEventListener('keydown',function(e){
  if(e.key==='Enter')tryUnlock();
});
(function(){
  var alreadyUnlocked=false;
  if(LOCK_REMEMBER_SESSION){
    try{alreadyUnlocked=sessionStorage.getItem('pub_index_unlocked')==='1';}catch(e){}
  }
  if(alreadyUnlocked){
    unlockApp();
  }else{
    setTimeout(function(){document.getElementById('lock-pw').focus();},150);
  }
})();

// ── REGISTRY ── 由 Claude 自動維護，請勿手動編輯
const ITEMS = [
    {"type":"html","name":"機密代號 Codenames 連線版","file":"tools/codenames.html","date":"2026-08-15","desc":"5×5 中文詞彙陣營推理 · 隊長／特務雙視角 · 房號連線多人對戰 · 可自訂280詞題庫 · 回合計時器","category":"life"},
    {"type":"html","name":"開發系統","file":"tools/prospect-leadgen-v3.html","date":"2026-07-27","desc":"輸入地區自動分批檢索工控廠商 · Q1/Q2/Q3/X1四層判斷 · R1角色分類 · 零幻覺防偽 · 匯出Excel/Google試算表含地圖與搜尋連結","category":"work"},
    {"type":"html","name":"業績分析工具 v5","file":"tools/sales-analytics-v5.html","date":"2026-07-24","desc":"分區業績分析：前年同期、多季加總、多年趨勢三種比較模式，支援多季累計檔、自動識別期間標籤、多Sheet自動偵測","category":"work"},
  {"type":"html","name":"Loopr","url":"https://darciachen.github.io/loopr-RC-50/loopr.html","date":"2026-06-15","desc":"多軌混音工具","category":"music"},
  {"type":"html","name":"P50 校準工具","file":"p50-cal.html","date":"2026-06-14","desc":"機率校準練習工具","category":"work"},
  {"type":"firebase","name":"作戰中心 Work Command Center","url":"https://darciachen.github.io/work-center","date":"2026-06-15","desc":"AI 工作管理系統 · 語音記錄 · 任務追蹤 · 供應鏈 · 業務","category":"work"},
  {"type":"script","name":"工控儀表業務客戶拜訪系統","url":"https://script.google.com/macros/s/AKfycbydqPmPdiwHUIiZjDL4yYxXl7YLuULCkZhTTjpKmH1h1uEbukAju548xSGExLKmM8A7/exec","date":"2026-06-16","desc":"客戶拜訪紀錄 · 今日排程 · 前購搜尋 · AI 解析 · v4.5","category":"work"},
  {"type":"html","name":"電子鋼琴 / 吉他模擬器","file":"piano-guitar.html","date":"2026-06-21","desc":"3音域鍵盤+吉他模式 · K-S物理建模木吉他音色 · 13和弦11撥弦模式 · 節拍器/鼓組 · 和弦循環","category":"music"},
  {"type":"html","name":"唸給我聽 · 文字朗讀","file":"voice-reader.html","date":"2026-06-22","desc":"輸入文字即朗讀 · 瀏覽器內建女聲 · 可調速度音調 · 無需安裝","category":"music"},
  {"type":"html","name":"CONCH SCR 選型報價","file":"qs-search-tool.html","date":"2026-06-22","desc":"SCR電力調整器查價 · 折扣計算 · 負載選型 · 密碼鎖定保護","category":"work"},
  {"type":"html","name":"寶寶探索樂園","file":"kids-game.html","date":"2026-06-24","desc":"緹緹的遊戲","category":"life"},
  {"type":"html","name":"日文歌詞羅馬拼音標注","file":"jp-romaji-tool.html","date":"2026-06-27","desc":"kuromoji.js自動斷詞 · 逐詞拼音對齊 · 教學用羅馬拼音轉換","category":"music"},
  {"type":"html","name":"歌詞 × 吉他譜 合併工具","file":"lyric-tab-merge.html","date":"2026-06-28","desc":"支援小節線|格式吉他譜 · 日文歌詞自動轉羅馬拼音(kuromoji) · 三層格式來源可語音比對自動對齊 · 不保留原歌詞文字","category":"music"}
];

const BASE = 'https://darciachen.github.io/pub/';

const TAG_LABEL = { html: 'HTML', script: 'Apps Script', firebase: 'Firebase', link: '外部連結' };

function getUrl(item) {
  if (item.url) return item.url;
  if (item.file) return BASE + item.file;
  return '#';
}

const CATEGORIES = [
  { key: 'work',  label: '業務／工作' },
  { key: 'music', label: '音樂／語言' },
  { key: 'life',  label: '生活／娛樂' }
];

const listEl = document.getElementById('sections');
const emptyEl = document.getElementById('empty');
const countEl = document.getElementById('count');

function itemHtml(item) {
  return `
    <a class="item" href="${getUrl(item)}" target="_blank">
      <span class="tag tag-${item.type}">${TAG_LABEL[item.type] || item.type}</span>
      <div class="info">
        <div class="name">${item.name}</div>
        <div class="meta">${item.date}${item.desc ? ' · ' + item.desc : ''}</div>
      </div>
      <span class="arrow">↗</span>
    </a>`;
}

function render(filter) {
  const cats = filter === 'all' ? CATEGORIES : CATEGORIES.filter(c => c.key === filter);
  countEl.textContent = filter === 'all' ? `${ITEMS.length} 個項目` : `${ITEMS.filter(i => i.category === filter).length} / ${ITEMS.length}`;

  let anyShown = false;
  const sectionsHtml = cats.map(cat => {
    const items = ITEMS
      .filter(i => i.category === cat.key)
      .slice()
      .sort((a, b) => b.date.localeCompare(a.date));
    if (!items.length) return '';
    anyShown = true;
    return `
      <div class="section">
        <div class="section-header">
          <span class="section-title">${cat.label}</span>
          <span class="section-count">${items.length}</span>
        </div>
        <div class="list">${items.map(itemHtml).join('')}</div>
      </div>`;
  }).join('');

  if (!anyShown) {
    listEl.innerHTML = '';
    emptyEl.classList.add('show');
    return;
  }
  emptyEl.classList.remove('show');
  listEl.innerHTML = sectionsHtml;
}

// Filter buttons
document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    render(btn.dataset.filter);
  });
});

render('all');
</script>
</body>
</html>
