<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>妙語說書人 Dixit</title>
<style>
  :root{
    --bg:#241a2e; --panel:#2f2140; --gold:#d4af6a; --gold-dim:#8a7245;
    --text:#f0e6d2; --text-dim:#b9aecb; --danger:#c0524a; --ok:#5a9b6f;
    --card-bg:#1a1424;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Microsoft JhengHei",sans-serif;
    background:radial-gradient(circle at 50% 0%, #3a2a4d, var(--bg) 70%);
    color:var(--text); min-height:100vh; padding-bottom:40px;
  }
  h1,h2,h3{font-weight:600; margin:.3em 0;}
  .wrap{max-width:760px; margin:0 auto; padding:16px;}
  .panel{
    background:var(--panel); border:1px solid var(--gold-dim); border-radius:14px;
    padding:18px; margin-bottom:16px; box-shadow:0 4px 18px rgba(0,0,0,.35);
  }
  .title-row{display:flex; align-items:center; justify-content:center; gap:10px; padding:18px 0 6px;}
  .title-row .gem{font-size:28px;}
  .title-row h1{font-size:22px; letter-spacing:2px; color:var(--gold);}
  input[type=text]{
    width:100%; padding:10px 12px; border-radius:8px; border:1px solid var(--gold-dim);
    background:#1d1528; color:var(--text); font-size:16px; margin:6px 0;
  }
  button{
    padding:10px 16px; border-radius:8px; border:1px solid var(--gold-dim);
    background:linear-gradient(180deg,#4a3a63,#382a52); color:var(--gold);
    font-size:15px; cursor:pointer; margin:4px 4px 4px 0;
  }
  button:disabled{opacity:.4; cursor:not-allowed;}
  button.primary{background:linear-gradient(180deg,var(--gold),#b8944e); color:#241a2e; border-color:var(--gold);}
  button.danger{border-color:var(--danger); color:#ff8f87;}
  .row{display:flex; flex-wrap:wrap; gap:10px; align-items:center;}
  .muted{color:var(--text-dim); font-size:13px;}
  .badge{
    display:inline-block; padding:2px 8px; border-radius:20px; font-size:12px;
    background:#3a2a4d; border:1px solid var(--gold-dim); color:var(--gold);
  }
  .player-list{list-style:none; padding:0; margin:8px 0;}
  .player-list li{
    display:flex; justify-content:space-between; padding:8px 10px; border-radius:8px;
    background:#241a30; margin-bottom:6px;
  }
  .player-list li.storyteller{border-left:3px solid var(--gold);}
  .card-grid{
    display:grid; grid-template-columns:repeat(auto-fill,minmax(110px,1fr)); gap:10px; margin-top:10px;
  }
  .card{
    position:relative; aspect-ratio:2/3; border-radius:10px; overflow:hidden;
    border:2px solid var(--gold-dim); background:var(--card-bg); cursor:pointer;
    transition:transform .15s, border-color .15s;
  }
  .card img{width:100%; height:100%; object-fit:cover; display:block;}
  .card.selected{border-color:var(--gold); transform:translateY(-6px); box-shadow:0 6px 14px rgba(212,175,106,.35);}
  .card.disabled{opacity:.35; cursor:not-allowed;}
  .card .vote-tag{
    position:absolute; bottom:4px; right:4px; background:rgba(212,175,106,.92); color:#241a2e;
    font-size:11px; font-weight:700; padding:1px 6px; border-radius:10px;
  }
  .card .owner-tag{
    position:absolute; top:4px; left:4px; background:rgba(0,0,0,.6); color:var(--gold);
    font-size:11px; padding:1px 6px; border-radius:10px;
  }
  .clue-box{
    background:#1d1528; border:1px dashed var(--gold-dim); border-radius:10px;
    padding:14px; text-align:center; font-size:18px; color:var(--gold); margin:10px 0;
  }
  .score-row{display:flex; justify-content:space-between; padding:4px 0; border-bottom:1px solid #3a2a4d;}
  .toast{
    position:fixed; bottom:16px; left:50%; transform:translateX(-50%);
    background:#1d1528; border:1px solid var(--gold); color:var(--gold);
    padding:10px 18px; border-radius:20px; font-size:14px; z-index:999; display:none;
  }
  .phase-tag{color:var(--gold-dim); font-size:13px; letter-spacing:1px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="title-row"><span class="gem">🎨</span><h1>妙語說書人 Dixit</h1></div>

  <!-- 大廳畫面 -->
  <div id="screen-lobby" class="panel">
    <h3>建立或加入房間</h3>
    <div id="lobby-create" class="row">
      <input type="text" id="input-name" placeholder="你的暱稱" maxlength="12">
      <button class="primary" id="btn-create-room">建立新房間</button>
    </div>
    <div class="row" style="margin-top:8px;">
      <input type="text" id="input-room-id" placeholder="房號（例：ab12cd）" maxlength="8">
      <button id="btn-join-room">加入房間</button>
    </div>
    <p class="muted">3 人以上才能開始遊戲。房號會自動帶入網址 <code>?room=</code>，分享網址給朋友即可一起玩。</p>
    <p class="muted" id="conn-status">連線狀態：初始化中…</p>
  </div>

  <!-- 房間內（等待/進行中） -->
  <div id="screen-room" class="panel" style="display:none;">
    <div class="row" style="justify-content:space-between;">
      <div><span class="badge" id="room-code-badge"></span> <span class="phase-tag" id="phase-tag"></span></div>
      <button id="btn-leave-room" class="danger">離開房間</button>
    </div>

    <h3>玩家</h3>
    <ul class="player-list" id="player-list"></ul>

    <div id="lobby-controls">
      <button class="primary" id="btn-start-game">開始遊戲</button>
      <p class="muted">建立房間的人可以按開始（需要至少 3 人）。</p>
    </div>

    <!-- 出題階段（說書人視角） -->
    <div id="phase-clue-teller" style="display:none;">
      <h3>輪到你當說書人：選一張牌，寫下謎題提示</h3>
      <input type="text" id="input-clue" placeholder="例如：一段孤獨的旅程" maxlength="40">
      <div class="card-grid" id="hand-teller"></div>
      <button class="primary" id="btn-submit-clue">送出提示與卡牌</button>
    </div>

    <!-- 出題階段（跟隨者等待） -->
    <div id="phase-clue-wait" style="display:none;">
      <h3>等待說書人出題…</h3>
      <p class="muted" id="clue-wait-countdown"></p>
    </div>

    <!-- 跟牌階段 -->
    <div id="phase-submit" style="display:none;">
      <div class="clue-box" id="clue-display"></div>
      <h3 id="submit-heading">挑一張跟這句提示最搭的牌</h3>
      <div class="card-grid" id="hand-follower"></div>
      <p class="muted" id="submit-wait-msg" style="display:none;">已送出，等待其他人…</p>
      <p class="muted" id="submit-wait-countdown"></p>
    </div>

    <!-- 投票階段 -->
    <div id="phase-vote" style="display:none;">
      <div class="clue-box" id="clue-display-vote"></div>
      <h3>猜猜看哪張是說書人的牌</h3>
      <div class="card-grid" id="vote-grid"></div>
      <p class="muted" id="vote-wait-msg" style="display:none;">已投票，等待其他人…</p>
      <p class="muted" id="vote-wait-countdown"></p>
    </div>

    <!-- 揭曉階段 -->
    <div id="phase-reveal" style="display:none;">
      <div class="clue-box" id="clue-display-reveal"></div>
      <h3>揭曉結果</h3>
      <div class="card-grid" id="reveal-grid"></div>
      <div id="reveal-summary" class="muted" style="margin-top:8px;"></div>
      <button class="primary" id="btn-next-round" style="margin-top:10px;">下一輪</button>
    </div>

    <h3 style="margin-top:18px;">計分板</h3>
    <div id="score-board"></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
// ============================================================
// 0. 核心遊戲邏輯（純函式版，來源：engine.js，已用 jsdom 測過 39 項）
// ============================================================
const HAND_SIZE = 6;
function shuffle(arr, rng = Math.random) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(rng() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function initGame(playerIds, deckSize, rng = Math.random) {
  if (playerIds.length < 3) throw new Error('Dixit 至少需要 3 位玩家');
  const minDeck = playerIds.length * HAND_SIZE;
  if (deckSize < minDeck) {
    throw new Error(`牌庫至少需要 ${minDeck} 張才能讓 ${playerIds.length} 位玩家開始遊戲，目前只有 ${deckSize} 張，麻煩再多加一些名畫圖片`);
  }
  const order = shuffle([...Array(deckSize).keys()], rng);
  let cursor = 0;
  const hands = {};
  for (const pid of playerIds) {
    hands[pid] = order.slice(cursor, cursor + HAND_SIZE);
    cursor += HAND_SIZE;
  }
  const drawPile = order.slice(cursor);
  const firstStoryteller = shuffle(playerIds, rng)[0];
  return {
    phase: 'clue', round: 1, storytellerId: firstStoryteller, hands, drawPile,
    discardPile: [], clue: null, submitted: {}, votes: {},
    scores: Object.fromEntries(playerIds.map(id => [id, 0])), playerIds: [...playerIds],
    phaseStartedAt: Date.now(),
  };
}
function autoPickCard(hand, rng = Math.random) {
  if (!hand || hand.length === 0) return null;
  return hand[Math.floor(rng() * hand.length)];
}
function autoPickVoteTarget(state, voterId, rng = Math.random) {
  const candidates = Object.keys(state.submitted).filter(id => id !== voterId);
  if (candidates.length === 0) return null;
  return candidates[Math.floor(rng() * candidates.length)];
}
function cloneLite(o){ return JSON.parse(JSON.stringify(o)); }

// Firebase Realtime Database 會把空物件 {} / 空陣列 [] 直接刪掉整個欄位，
// 不是存成空的，是欄位消失。換輪時 submitted/votes 重置成 {} 寫回去，
// 下一次讀出來時這兩個欄位就會是 undefined，導致後面的程式碼爆掉。
// 每次從 Firebase 讀到 game 物件、要拿去用之前，都要先過這一關補回預設值。
function normalizeGameState(game) {
  if (!game) return game;
  const next = { ...game };
  next.submitted = next.submitted || {};
  next.votes = next.votes || {};
  next.discardPile = next.discardPile || [];
  next.drawPile = next.drawPile || [];
  next.scores = next.scores || {};
  next.hands = next.hands || {};
  next.playerIds = next.playerIds || [];
  next.phaseStartedAt = next.phaseStartedAt || Date.now();
  for (const pid of next.playerIds) {
    if (!next.hands[pid]) next.hands[pid] = [];
    if (typeof next.scores[pid] !== 'number') next.scores[pid] = 0;
  }
  return next;
}

function submitClue(state, storytellerId, cardIndex, clueText) {
  if (state.phase !== 'clue') throw new Error('現在不是出題階段');
  if (storytellerId !== state.storytellerId) throw new Error('只有說書人能出題');
  if (!state.hands[storytellerId].includes(cardIndex)) throw new Error('這張牌不在你手上');
  if (!clueText || !clueText.trim()) throw new Error('提示文字不能空白');
  const next = cloneLite(state);
  next.clue = clueText.trim();
  next.submitted[storytellerId] = cardIndex;
  next.hands[storytellerId] = next.hands[storytellerId].filter(c => c !== cardIndex);
  next.phase = 'submit';
  next.phaseStartedAt = Date.now();
  return next;
}
function submitFollowerCard(state, playerId, cardIndex) {
  if (state.phase !== 'submit') throw new Error('現在不是跟牌階段');
  if (playerId === state.storytellerId) throw new Error('說書人不用跟牌');
  if (playerId in state.submitted) throw new Error('已經出過牌了');
  if (!state.hands[playerId].includes(cardIndex)) throw new Error('這張牌不在你手上');
  const next = cloneLite(state);
  next.submitted[playerId] = cardIndex;
  next.hands[playerId] = next.hands[playerId].filter(c => c !== cardIndex);
  const followers = state.playerIds.filter(id => id !== state.storytellerId);
  if (followers.every(id => id in next.submitted)) { next.phase = 'vote'; next.phaseStartedAt = Date.now(); }
  return next;
}
function castVote(state, voterId, votedForPlayerId) {
  if (state.phase !== 'vote') throw new Error('現在不是投票階段');
  if (voterId === state.storytellerId) throw new Error('說書人不投票');
  if (voterId === votedForPlayerId) throw new Error('不能投自己的牌');
  if (voterId in state.votes) throw new Error('已經投過票了');
  if (!(votedForPlayerId in state.submitted)) throw new Error('目標玩家沒有出牌');
  const next = cloneLite(state);
  next.votes[voterId] = votedForPlayerId;
  const followers = state.playerIds.filter(id => id !== state.storytellerId);
  if (followers.every(id => id in next.votes)) next.phase = 'reveal';
  return next;
}
function scoreRound(state) {
  if (state.phase !== 'reveal') throw new Error('還沒到揭曉階段');
  const next = cloneLite(state);
  const followers = state.playerIds.filter(id => id !== state.storytellerId);
  const totalFollowers = followers.length;
  const correctGuessers = followers.filter(id => state.votes[id] === state.storytellerId);
  const correctCount = correctGuessers.length;
  const allCorrect = correctCount === totalFollowers;
  const noneCorrect = correctCount === 0;
  const roundResult = { storytellerPoints: 0, followerPoints: {}, baitBonus: {} };
  for (const id of followers) roundResult.followerPoints[id] = 0;
  if (allCorrect || noneCorrect) {
    roundResult.storytellerPoints = 0;
    for (const id of followers) roundResult.followerPoints[id] += 2;
  } else {
    roundResult.storytellerPoints = 3;
    for (const id of correctGuessers) roundResult.followerPoints[id] += 3;
  }
  for (const voterId of followers) {
    const votedFor = state.votes[voterId];
    if (votedFor !== state.storytellerId) {
      roundResult.baitBonus[votedFor] = (roundResult.baitBonus[votedFor] || 0) + 1;
      roundResult.followerPoints[votedFor] = (roundResult.followerPoints[votedFor] || 0) + 1;
    }
  }
  next.scores[state.storytellerId] += roundResult.storytellerPoints;
  for (const id of followers) next.scores[id] += (roundResult.followerPoints[id] || 0);
  next.roundResult = roundResult;
  next.phase = 'roundEnd';
  return next;
}
function nextRound(state, rng = Math.random) {
  if (state.phase !== 'roundEnd') throw new Error('本輪還沒結束');
  const next = cloneLite(state);
  const playedCards = Object.values(state.submitted);
  next.discardPile = [...state.discardPile, ...playedCards];
  let drawPile = [...next.drawPile];
  for (const pid of next.playerIds) {
    while (next.hands[pid].length < HAND_SIZE) {
      if (drawPile.length === 0) {
        if (next.discardPile.length === 0) break;
        drawPile = shuffle(next.discardPile, rng);
        next.discardPile = [];
      }
      next.hands[pid].push(drawPile.shift());
    }
  }
  next.drawPile = drawPile;
  const idx = next.playerIds.indexOf(state.storytellerId);
  next.storytellerId = next.playerIds[(idx + 1) % next.playerIds.length];
  next.round += 1;
  next.clue = null; next.submitted = {}; next.votes = {}; next.roundResult = null;
  next.phase = 'clue';
  next.phaseStartedAt = Date.now();
  return next;
}

// ============================================================
// 1. 名畫牌庫（起步 9 張已核對過的 Wikimedia CC0/PD 直連圖，
//    之後可持續擴充，不影響上面的引擎邏輯）
// ============================================================

// 2. Firebase 連線層（沿用 boardgame-e7604 專案，新節點 dixit-rooms）
//    連不上時自動 fallback 到 LocalNet（BroadcastChannel 本機測試模式）
// ============================================================
const FIREBASE_CONFIG = {
  apiKey:       "AIzaSyDeBWfbik3PdIQNmCpIdVX3zNau7f-aZh4",
  authDomain:   "boardgame-e7604.firebaseapp.com",
  databaseURL:  "https://boardgame-e7604-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId:    "boardgame-e7604",
  appId:        "1:75927885494:web:a88edbd4798c8f4788f817"
};
const FB_VERSION = "10.12.5";
const NODE_ROOT = "dixit-rooms";

let backend = null; // { readRoom, writeRoom, subscribeRoom, mode }

async function initBackend() {
  try {
    const [{ initializeApp }, { getDatabase, ref, set, get, onValue, update, runTransaction }] = await Promise.all([
      import(`https://www.gstatic.com/firebasejs/${FB_VERSION}/firebase-app.js`),
      import(`https://www.gstatic.com/firebasejs/${FB_VERSION}/firebase-database.js`),
    ]);
    const app = initializeApp(FIREBASE_CONFIG);
    const db = getDatabase(app);
    backend = {
      mode: 'firebase',
      async writeRoom(roomId, data) { await set(ref(db, `${NODE_ROOT}/${roomId}`), data); },
      async updateRoom(roomId, patch) { await update(ref(db, `${NODE_ROOT}/${roomId}`), patch); },
      async readRoom(roomId) { const s = await get(ref(db, `${NODE_ROOT}/${roomId}`)); return s.exists() ? s.val() : null; },
      subscribeRoom(roomId, cb) { return onValue(ref(db, `${NODE_ROOT}/${roomId}`), s => cb(s.exists() ? s.val() : null)); },
      // 對 game 子節點做原子交易：fn 收到「當下真正最新」的 game，避免兩人同時出牌/投票互相覆蓋
      async transactionGame(roomId, fn) {
        let opError = null;
        const result = await runTransaction(ref(db, `${NODE_ROOT}/${roomId}/game`), (currentGame) => {
          try { return fn(normalizeGameState(currentGame)); }
          catch (e) { opError = e; return; /* 回傳 undefined = 放棄本次交易，不寫入 */ }
        });
        if (opError) throw opError;
        return result;
      },
    };
    setConnStatus('Firebase 連線中（跨裝置同步）');
  } catch (err) {
    console.error('Firebase 初始化失敗，改用本機測試模式：', err);
    initLocalBackend();
  }
}

function initLocalBackend() {
  const bc = new BroadcastChannel('dixit-localnet');
  const store = {};
  const listeners = {};
  bc.onmessage = (ev) => {
    const { roomId, data, patch } = ev.data;
    if (patch !== undefined) {
      // 套用 patch 到「自己手上最新的資料」，而不是接受對方算好的整包結果，
      // 這樣即使兩個分頁近乎同時各自 patch 不同的 key，最終都會收斂一致
      store[roomId] = applyPathPatch(store[roomId], patch);
    } else {
      store[roomId] = data;
    }
    (listeners[roomId] || []).forEach(cb => cb(store[roomId]));
  };
  // 支援 Firebase 風格的「路徑鍵」patch，例如 {'players/abc123': {name:'x'}}
  // 會合併到 players.abc123，而不是整個蓋掉 players
  function applyPathPatch(obj, patch) {
    const next = { ...(obj || {}) };
    for (const [path, val] of Object.entries(patch)) {
      const parts = path.split('/');
      let cursor = next;
      for (let i = 0; i < parts.length - 1; i++) {
        cursor[parts[i]] = { ...(cursor[parts[i]] || {}) };
        cursor = cursor[parts[i]];
      }
      const lastKey = parts[parts.length - 1];
      // 跟 Firebase 行為一致：patch 值是 null，代表要把這個 key 整個刪掉，不是存成 null
      if (val === null) delete cursor[lastKey];
      else cursor[lastKey] = val;
    }
    return next;
  }
  // BroadcastChannel 規格上不會把訊息送回發送者自己，所以每次本地寫入後
  // 除了廣播給其他分頁，也要直接呼叫自己這份的訂閱者，不然自己的畫面永遠不會刷新
  function notifyLocal(roomId) {
    (listeners[roomId] || []).forEach(cb => cb(store[roomId]));
  }
  backend = {
    mode: 'local',
    async writeRoom(roomId, data) { store[roomId] = data; bc.postMessage({ roomId, data }); notifyLocal(roomId); },
    async updateRoom(roomId, patch) {
      store[roomId] = applyPathPatch(store[roomId], patch);
      bc.postMessage({ roomId, patch });
      notifyLocal(roomId);
    },
    async readRoom(roomId) { return store[roomId] || null; },
    subscribeRoom(roomId, cb) {
      listeners[roomId] = listeners[roomId] || [];
      listeners[roomId].push(cb);
      if (store[roomId]) cb(store[roomId]);
      return () => { listeners[roomId] = listeners[roomId].filter(f => f !== cb); };
    },
    // 本機測試模式的交易：每次都從自己這份最新 store 讀取再算，降低（但不保證消除）
    // 跨視窗近乎同時操作的覆蓋風險——LocalNet 本來就只是離線測試用的簡化模式
    async transactionGame(roomId, fn) {
      const currentGame = (store[roomId] || {}).game;
      const nextGame = fn(normalizeGameState(currentGame));
      store[roomId] = { ...(store[roomId] || {}), game: nextGame };
      bc.postMessage({ roomId, data: store[roomId] });
      notifyLocal(roomId);
      return { committed: true, snapshot: { val: () => nextGame } };
    },
  };
  setConnStatus('本機測試模式（僅同分頁裝置可同步，正式連線請部署到 HTTPS）');
}

function setConnStatus(text) {
  const el = document.getElementById('conn-status');
  if (el) el.textContent = '連線狀態：' + text;
}

// ============================================================
// 3. UI 狀態與畫面切換
// ============================================================
let myId = null;
let myName = null;
let currentRoomId = null;
let unsubscribe = null;
let selectedCardIndex = null;

function uid() { return 'u' + Math.random().toString(36).slice(2, 10); }
function roomCode() { return Math.random().toString(36).slice(2, 8); }

// 記住「這個瀏覽器在這個房間裡是誰」，重新整理/退出重進同一個房間時
// 認回原本的身份（覆蓋同一個 id），而不是每次都產生新 id 變成另一個幽靈玩家卡在名單裡
function getStoredIdentity(roomId) {
  try { return localStorage.getItem('dixit_identity_' + roomId) || null; }
  catch (e) { return null; }
}
function storeIdentity(roomId, id) {
  try { localStorage.setItem('dixit_identity_' + roomId, id); } catch (e) {}
}
function clearStoredIdentity(roomId) {
  try { localStorage.removeItem('dixit_identity_' + roomId); } catch (e) {}
}
function storeName(name) {
  try { localStorage.setItem('dixit_last_name', name); } catch (e) {}
}
function getStoredName() {
  try { return localStorage.getItem('dixit_last_name') || ''; } catch (e) { return ''; }
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.display = 'block';
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => { t.style.display = 'none'; }, 2200);
}

function el(id) { return document.getElementById(id); }

async function createRoom() {
  const name = el('input-name').value.trim();
  if (!name) return showToast('請先輸入暱稱');
  myId = uid(); myName = name;
  currentRoomId = roomCode();
  storeIdentity(currentRoomId, myId);
  const room = {
    createdAt: Date.now(),
    hostId: myId,
    players: { [myId]: { name, connected: true } },
    game: null,
  };
  await backend.writeRoom(currentRoomId, room);
  history.replaceState(null, '', `?room=${currentRoomId}`);
  enterRoom();
}

async function joinRoom(silent = false) {
  const name = el('input-name').value.trim();
  const rid = el('input-room-id').value.trim();
  if (!name) { if (!silent) showToast('請先輸入暱稱'); return false; }
  if (!rid) { if (!silent) showToast('請輸入房號'); return false; }
  myId = getStoredIdentity(rid) || uid();
  storeIdentity(rid, myId);
  storeName(name);
  myName = name;
  currentRoomId = rid;
  const room = await backend.readRoom(rid);
  if (!room) { if (!silent) showToast('找不到這個房間'); return false; }
  // 用路徑鍵 patch，只新增/更新自己這個節點，不會覆蓋掉同時加入的其他玩家；
  // 如果是同一個人重進，myId 跟之前一樣，這裡會直接覆蓋更新舊的那筆，不會多出一個幽靈玩家
  await backend.updateRoom(rid, { [`players/${myId}`]: { name, connected: true } });
  history.replaceState(null, '', `?room=${rid}`);
  enterRoom();
  return true;
}

function enterRoom() {
  el('screen-lobby').style.display = 'none';
  el('screen-room').style.display = 'block';
  el('room-code-badge').textContent = '房號 ' + currentRoomId;
  unsubscribe = backend.subscribeRoom(currentRoomId, renderRoom);
}

async function leaveRoom() {
  // 真的把自己從房間的玩家名單移除，不然幽靈玩家會一直卡在名單裡，
  // 遊戲開始後如果幽靈玩家被排進跟隨者名單，會永遠卡住等一個不存在的人出牌/投票
  if (currentRoomId && myId) {
    try { await backend.updateRoom(currentRoomId, { [`players/${myId}`]: null }); }
    catch (e) { console.error('離開房間時移除玩家失敗：', e); }
    clearStoredIdentity(currentRoomId);
  }
  if (unsubscribe) unsubscribe();
  currentRoomId = null; myId = null;
  history.replaceState(null, '', location.pathname);
  el('screen-room').style.display = 'none';
  el('screen-lobby').style.display = 'block';
}

let latestRoom = null;

function renderRoom(room) {
  if (!room) return;
  if (room.game) room.game = normalizeGameState(room.game);
  latestRoom = room;
  const players = room.players || {};
  const playerIds = Object.keys(players);

  // 玩家列表
  const list = el('player-list');
  list.innerHTML = '';
  for (const pid of playerIds) {
    const li = document.createElement('li');
    const isTeller = room.game && room.game.storytellerId === pid;
    if (isTeller) li.classList.add('storyteller');
    const scoreTxt = room.game ? `${room.game.scores[pid] ?? 0} 分` : '';
    li.innerHTML = `<span>${escapeHtml(players[pid].name)}${pid===room.hostId?' 👑':''}${isTeller?' 🖋️說書人':''}</span><span class="muted">${scoreTxt}</span>`;
    list.appendChild(li);
  }

  // 大廳 vs 遊戲中
  const inLobby = !room.game;
  el('lobby-controls').style.display = inLobby ? 'block' : 'none';
  el('btn-start-game').disabled = playerIds.length < 3 || myId !== room.hostId;
  el('phase-tag').textContent = inLobby ? '大廳' : phaseLabel(room.game.phase);

  hideAllPhaseBlocks();
  if (inLobby) return;

  const game = room.game;
  renderScoreBoard(game, players);

  if (game.phase === 'clue') {
    if (game.storytellerId === myId) {
      el('phase-clue-teller').style.display = 'block';
      renderHandForClue(game);
    } else {
      el('phase-clue-wait').style.display = 'block';
    }
  } else if (game.phase === 'submit') {
    el('phase-submit').style.display = 'block';
    el('clue-display').textContent = '提示：' + game.clue;
    if (game.storytellerId === myId || myId in game.submitted) {
      el('hand-follower').style.display = 'none';
      el('submit-wait-msg').style.display = 'block';
      el('submit-heading').style.display = 'none';
    } else {
      el('hand-follower').style.display = 'grid';
      el('submit-wait-msg').style.display = 'none';
      el('submit-heading').style.display = 'block';
      renderHandForSubmit(game);
    }
  } else if (game.phase === 'vote') {
    el('phase-vote').style.display = 'block';
    el('clue-display-vote').textContent = '提示：' + game.clue;
    if (game.storytellerId === myId || myId in game.votes) {
      el('vote-grid').style.display = 'none';
      el('vote-wait-msg').style.display = 'block';
    } else {
      el('vote-grid').style.display = 'grid';
      el('vote-wait-msg').style.display = 'none';
      renderVoteGrid(game);
    }
  } else if (game.phase === 'reveal' || game.phase === 'roundEnd') {
    el('phase-reveal').style.display = 'block';
    el('clue-display-reveal').textContent = '提示：' + game.clue;
    renderReveal(game, players);
    el('btn-next-round').style.display = game.phase === 'roundEnd' ? 'inline-block' : 'none';
    el('btn-next-round').disabled = myId !== room.hostId;
  }
}

function phaseLabel(p) {
  return { clue: '出題中', submit: '跟牌中', vote: '投票中', reveal: '揭曉中', roundEnd: '本輪結束' }[p] || p;
}

function hideAllPhaseBlocks() {
  ['phase-clue-teller','phase-clue-wait','phase-submit','phase-vote','phase-reveal']
    .forEach(id => el(id).style.display = 'none');
}

function renderScoreBoard(game, players) {
  const box = el('score-board');
  box.innerHTML = '';
  const sorted = Object.entries(game.scores).sort((a,b) => b[1]-a[1]);
  for (const [pid, score] of sorted) {
    const row = document.createElement('div');
    row.className = 'score-row';
    row.innerHTML = `<span>${escapeHtml(players[pid]?.name || '?')}</span><span>${score} 分</span>`;
    box.appendChild(row);
  }
}

function cardImgHtml(cardIndex) {
  const c = CARD_DECK[cardIndex % CARD_DECK.length];
  return `<img src="${c.imageUrl}" alt="${escapeHtml(c.title)}" loading="lazy">`;
}

function renderHandForClue(game) {
  const grid = el('hand-teller');
  grid.innerHTML = '';
  selectedCardIndex = null;
  for (const c of game.hands[myId]) {
    const div = document.createElement('div');
    div.className = 'card';
    div.innerHTML = cardImgHtml(c);
    div.onclick = () => {
      selectedCardIndex = c;
      [...grid.children].forEach(ch => ch.classList.remove('selected'));
      div.classList.add('selected');
    };
    grid.appendChild(div);
  }
}

function renderHandForSubmit(game) {
  const grid = el('hand-follower');
  grid.innerHTML = '';
  for (const c of game.hands[myId]) {
    const div = document.createElement('div');
    div.className = 'card';
    div.innerHTML = cardImgHtml(c);
    div.onclick = () => submitMyCard(c);
    grid.appendChild(div);
  }
}

function renderVoteGrid(game) {
  const grid = el('vote-grid');
  grid.innerHTML = '';
  // 隨機順序顯示所有已交出的牌（匿名，不顯示是誰的）
  const entries = Object.entries(game.submitted); // [pid, cardIndex]
  const shuffled = shuffle(entries, Math.random);
  for (const [pid, cardIndex] of shuffled) {
    if (pid === myId) continue; // 不能投自己的牌
    const div = document.createElement('div');
    div.className = 'card';
    div.innerHTML = cardImgHtml(cardIndex);
    div.onclick = () => submitMyVote(pid);
    grid.appendChild(div);
  }
}

function renderReveal(game, players) {
  const grid = el('reveal-grid');
  grid.innerHTML = '';
  const entries = Object.entries(game.submitted);
  for (const [pid, cardIndex] of entries) {
    const div = document.createElement('div');
    div.className = 'card';
    const isTellerCard = pid === game.storytellerId;
    const votesForThis = Object.values(game.votes || {}).filter(v => v === pid).length;
    div.innerHTML = cardImgHtml(cardIndex)
      + `<span class="owner-tag">${escapeHtml(players[pid]?.name || '?')}${isTellerCard ? ' 🖋️' : ''}</span>`
      + (votesForThis > 0 ? `<span class="vote-tag">${votesForThis}票</span>` : '');
    grid.appendChild(div);
  }
  if (game.phase === 'roundEnd' && game.roundResult) {
    const r = game.roundResult;
    const tellerName = players[game.storytellerId]?.name || '?';
    let lines = [];
    if (r.storytellerPoints === 0) {
      lines.push(`全員猜中或全員猜錯，說書人 ${tellerName} 本輪 0 分，所有跟隨者 +2 分。`);
    } else {
      lines.push(`部分猜中，說書人 ${tellerName} +3 分，猜中的跟隨者 +3 分。`);
    }
    const baitEntries = Object.entries(r.baitBonus || {});
    if (baitEntries.length) {
      lines.push('誘導加成：' + baitEntries.map(([pid,n]) => `${players[pid]?.name || '?'} +${n}`).join('、'));
    }
    el('reveal-summary').innerHTML = lines.map(l => `<div>${l}</div>`).join('');
  } else {
    el('reveal-summary').textContent = '';
  }
}

// ============================================================
// 4. 玩家操作 -> 呼叫引擎純函式 -> 寫回 backend
// ============================================================
async function startGame() {
  const playerIds = Object.keys(latestRoom.players);
  if (playerIds.length < 3) return showToast('至少需要 3 人才能開始');
  try {
    await backend.transactionGame(currentRoomId, (currentGame) => {
      if (currentGame) return currentGame; // 已經有人搶先開始了，不重複初始化
      return initGame(playerIds, CARD_DECK.length, Math.random);
    });
  } catch (e) { showToast(e.message); }
}

async function submitClueAction() {
  const clueText = el('input-clue').value;
  if (selectedCardIndex === null) return showToast('請先選一張牌');
  try {
    await backend.transactionGame(currentRoomId, (currentGame) => submitClue(currentGame, myId, selectedCardIndex, clueText));
    el('input-clue').value = '';
  } catch (e) { showToast(e.message); }
}

async function submitMyCard(cardIndex) {
  try {
    await backend.transactionGame(currentRoomId, (currentGame) => submitFollowerCard(currentGame, myId, cardIndex));
  } catch (e) { showToast(e.message); }
}

async function submitMyVote(votedForPlayerId) {
  try {
    await backend.transactionGame(currentRoomId, (currentGame) => {
      let game = castVote(currentGame, myId, votedForPlayerId);
      if (game.phase === 'reveal') game = scoreRound(game);
      return game;
    });
  } catch (e) { showToast(e.message); }
}

async function goNextRound() {
  try {
    await backend.transactionGame(currentRoomId, (currentGame) => nextRound(currentGame, Math.random));
  } catch (e) { showToast(e.message); }
}

// ============================================================
// 4b. 托管代打：等太久沒人動作，系統自動幫卡住的人選一張牌/投一票，
//     避免整場遊戲卡死等一個離線或分心的玩家。
//     每個連線中的裝置都會各自檢查，靠 transactionGame 的原子性保證
//     就算好幾台裝置同時想代打，也只有一次真的生效，不會出錯。
// ============================================================
const AUTO_PLAY_TIMEOUT_MS = 90 * 1000; // 90 秒沒動作就代打，可依需要調整

async function checkAndAutoPlay() {
  const room = latestRoom;
  if (!room || !room.game || !currentRoomId) return;
  const game = room.game;
  const elapsed = Date.now() - (game.phaseStartedAt || Date.now());
  if (elapsed < AUTO_PLAY_TIMEOUT_MS) return;

  if (game.phase === 'clue') {
    if (game.storytellerId in game.submitted) return; // 已經有人处理過了
    try {
      await backend.transactionGame(currentRoomId, (g) => {
        const cur = normalizeGameState(g);
        if (!cur || cur.phase !== 'clue') return cur; // 狀態已經變了，別人搶先處理了
        if (cur.storytellerId in cur.submitted) return cur;
        const card = autoPickCard(cur.hands[cur.storytellerId], Math.random);
        if (card === null) return cur; // 沒手牌可代打，放棄（理論上不該發生）
        return submitClue(cur, cur.storytellerId, card, '（已托管自動出題）');
      });
    } catch (e) { /* 交易失敗代表已經有其他裝置代打過了，忽略即可 */ }
  } else if (game.phase === 'submit') {
    const followers = game.playerIds.filter(id => id !== game.storytellerId);
    for (const pid of followers) {
      if (pid in game.submitted) continue;
      try {
        await backend.transactionGame(currentRoomId, (g) => {
          const cur = normalizeGameState(g);
          if (!cur || cur.phase !== 'submit') return cur;
          if (pid in cur.submitted) return cur;
          const card = autoPickCard(cur.hands[pid], Math.random);
          if (card === null) return cur;
          return submitFollowerCard(cur, pid, card);
        });
      } catch (e) { /* 忽略，可能已經被代打過或本人剛好也送出了 */ }
    }
  } else if (game.phase === 'vote') {
    const followers = game.playerIds.filter(id => id !== game.storytellerId);
    for (const pid of followers) {
      if (pid in game.votes) continue;
      try {
        await backend.transactionGame(currentRoomId, (g) => {
          const cur = normalizeGameState(g);
          if (!cur || cur.phase !== 'vote') return cur;
          if (pid in cur.votes) return cur;
          const target = autoPickVoteTarget(cur, pid, Math.random);
          if (target === null) return cur;
          let next = castVote(cur, pid, target);
          if (next.phase === 'reveal') next = scoreRound(next);
          return next;
        });
      } catch (e) { /* 忽略 */ }
    }
  }
}

setInterval(() => { checkAndAutoPlay().catch(() => {}); }, 5000);

// 每秒更新等待畫面上的倒數文字，讓玩家知道還要多久會被系統代打
setInterval(() => {
  const room = latestRoom;
  if (!room || !room.game) return;
  const game = room.game;
  const remain = Math.max(0, AUTO_PLAY_TIMEOUT_MS - (Date.now() - (game.phaseStartedAt || Date.now())));
  const secs = Math.ceil(remain / 1000);
  const text = secs > 0 ? `還有 ${secs} 秒沒動作會被系統自動代打` : '即將自動代打…';
  const countdownIds = ['clue-wait-countdown', 'submit-wait-countdown', 'vote-wait-countdown'];
  for (const id of countdownIds) {
    const elm = document.getElementById(id);
    if (elm) elm.textContent = text;
  }
}, 1000);

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// ============================================================
// 5. 綁定事件、啟動
// ============================================================
el('btn-create-room').onclick = createRoom;
el('btn-join-room').onclick = () => joinRoom(false);
el('btn-leave-room').onclick = leaveRoom;
el('btn-start-game').onclick = startGame;
el('btn-submit-clue').onclick = submitClueAction;
el('btn-next-round').onclick = goNextRound;

(async function init() {
  await initBackend();
  const storedName = getStoredName();
  if (storedName) el('input-name').value = storedName;

  const params = new URLSearchParams(location.search);
  const rid = params.get('room');
  if (rid) {
    el('input-room-id').value = rid;
    // 網址帶房號、瀏覽器又記得這個房間的身份跟暱稱時，直接自動接回房間，
    // 不用使用者手動再按一次「加入房間」——意外滑掉/重整回來時體驗才會順
    const storedId = getStoredIdentity(rid);
    if (storedId && storedName) {
      const ok = await joinRoom(true);
      if (!ok) showToast('自動接回房間失敗，麻煩手動按「加入房間」');
    }
  }
})();
</script>
