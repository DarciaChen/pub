<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>牌庫預覽</title>
<style>
  :root{
    --bg:#241a2e; --panel:#2f2140; --gold:#d4af6a; --gold-dim:#8a7245;
    --text:#f0e6d2; --text-dim:#b9aecb; --danger:#c0524a; --ok:#5a9b6f; --card-bg:#1a1424;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Microsoft JhengHei",sans-serif;
    background:radial-gradient(circle at 50% 0%, #3a2a4d, var(--bg) 70%);
    color:var(--text); min-height:100vh; padding-bottom:60px;
  }
  .wrap{max-width:1100px; margin:0 auto; padding:16px;}
  h1{font-size:20px; color:var(--gold); text-align:center; letter-spacing:1px; margin:18px 0 6px;}
  .panel{
    background:var(--panel); border:1px solid var(--gold-dim); border-radius:14px;
    padding:14px; margin-bottom:14px; box-shadow:0 4px 18px rgba(0,0,0,.35);
  }
  .muted{color:var(--text-dim); font-size:13px; line-height:1.6;}
  .toolbar{display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-top:8px;}
  select, input[type=text]{
    padding:8px 10px; border-radius:8px; border:1px solid var(--gold-dim);
    background:#1d1528; color:var(--text); font-size:14px;
  }
  button{
    padding:9px 14px; border-radius:8px; border:1px solid var(--gold-dim);
    background:linear-gradient(180deg,#4a3a63,#382a52); color:var(--gold);
    font-size:14px; cursor:pointer;
  }
  button.primary{background:linear-gradient(180deg,var(--gold),#b8944e); color:#241a2e; border-color:var(--gold);}
  button.small{padding:4px 10px; font-size:12px;}
  .badge{display:inline-block; padding:2px 8px; border-radius:20px; font-size:12px; background:#3a2a4d; border:1px solid var(--gold-dim); color:var(--gold);}
  .grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(130px,1fr)); gap:10px; margin-top:12px;}
  .card{
    background:#1d1528; border:2px solid var(--gold-dim); border-radius:10px; padding:6px;
    font-size:11px; position:relative; cursor:pointer; transition:border-color .15s, opacity .15s;
  }
  .card.marked{border-color:var(--danger); opacity:.4;}
  .card img{width:100%; aspect-ratio:2/3; object-fit:cover; border-radius:6px; display:block; margin-bottom:4px; background:#111;}
  .card .broken{width:100%; aspect-ratio:2/3; display:flex; align-items:center; justify-content:center; font-size:11px; color:var(--danger); border:1px dashed var(--danger); border-radius:6px; margin-bottom:4px;}
  .card .idx{position:absolute; top:8px; left:8px; background:rgba(0,0,0,.7); color:var(--gold); font-size:10px; padding:1px 5px; border-radius:8px;}
  .card .artist{color:var(--gold); font-weight:600; display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .card .title{color:var(--text-dim); display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .mark-tag{position:absolute; top:8px; right:8px; background:var(--danger); color:#fff; font-size:10px; padding:1px 6px; border-radius:8px; display:none;}
  .card.marked .mark-tag{display:block;}
  #output-panel{display:none;}
  #output{width:100%; min-height:140px; font-family:monospace; font-size:13px; white-space:pre;
    padding:10px; border-radius:8px; border:1px solid var(--gold-dim); background:#1d1528; color:var(--text);}
  .sticky-bar{
    position:sticky; top:0; z-index:10; background:var(--bg); padding:10px 0; margin:-16px -16px 10px;
    padding-left:16px; padding-right:16px; border-bottom:1px solid var(--gold-dim);
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="sticky-bar">
    <h1>🎨 牌庫預覽（點卡片標記要刪的）</h1>
    <div class="toolbar">
      <select id="filter-artist"><option value="">全部畫家</option></select>
      <input type="text" id="filter-search" placeholder="搜尋標題關鍵字…">
      <span class="badge" id="count-badge"></span>
      <span class="badge" id="marked-badge" style="border-color:var(--danger); color:#ff8f87;"></span>
      <button class="small" id="btn-clear-marks">清空標記</button>
      <button class="primary" id="btn-generate">產生要刪除的清單</button>
    </div>
  </div>

  <p class="muted">點卡片＝標記要刪除（會變暗、右上角出現「刪」）。再點一次取消標記。圖片顯示不出來的，本來就該刪。挑完按「產生要刪除的清單」，把輸出貼給 Claude 就會幫你從牌庫拿掉。</p>

  <div class="grid" id="grid"></div>

  <div class="panel" id="output-panel">
    <div class="toolbar" style="justify-content:space-between;">
      <h3 style="margin:0;">已標記 <span id="output-count">0</span> 張要刪除</h3>
      <button class="small" id="btn-copy">複製</button>
    </div>
    <textarea id="output" readonly></textarea>
  </div>
</div>

let marked = new Set(); // 存 index

function uniqueArtists() {
  return [...new Set(CARD_DECK.map(c => c.artist))];
}

function populateFilter() {
  const sel = document.getElementById('filter-artist');
  for (const a of uniqueArtists()) {
    const opt = document.createElement('option');
    opt.value = a; opt.textContent = a + '（' + CARD_DECK.filter(c => c.artist === a).length + '）';
    sel.appendChild(opt);
  }
}

function renderGrid() {
  const artistFilter = document.getElementById('filter-artist').value;
  const search = document.getElementById('filter-search').value.trim().toLowerCase();
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  let shown = 0;

  CARD_DECK.forEach((c, idx) => {
    if (artistFilter && c.artist !== artistFilter) return;
    if (search && !c.title.toLowerCase().includes(search) && !c.artist.toLowerCase().includes(search)) return;
    shown++;

    const card = document.createElement('div');
    card.className = 'card' + (marked.has(idx) ? ' marked' : '');
    card.onclick = () => {
      if (marked.has(idx)) marked.delete(idx); else marked.add(idx);
      renderGrid();
    };

    const img = document.createElement('img');
    img.src = c.imageUrl;
    img.loading = 'lazy';
    img.onerror = () => {
      const broken = document.createElement('div');
      broken.className = 'broken';
      broken.textContent = '打不開';
      img.replaceWith(broken);
    };
    card.appendChild(img);

    const idxTag = document.createElement('span');
    idxTag.className = 'idx';
    idxTag.textContent = '#' + idx;
    card.appendChild(idxTag);

    const markTag = document.createElement('span');
    markTag.className = 'mark-tag';
    markTag.textContent = '刪';
    card.appendChild(markTag);

    const artistEl = document.createElement('span');
    artistEl.className = 'artist';
    artistEl.textContent = c.artist;
    card.appendChild(artistEl);

    const titleEl = document.createElement('span');
    titleEl.className = 'title';
    titleEl.textContent = c.title;
    card.appendChild(titleEl);

    grid.appendChild(card);
  });

  document.getElementById('count-badge').textContent = `顯示 ${shown} / ${CARD_DECK.length} 張`;
  document.getElementById('marked-badge').textContent = `已標記 ${marked.size} 張`;
}

document.getElementById('filter-artist').onchange = renderGrid;
document.getElementById('filter-search').oninput = renderGrid;
document.getElementById('btn-clear-marks').onclick = () => { marked.clear(); renderGrid(); };

document.getElementById('btn-generate').onclick = () => {
  const items = [...marked].sort((a, b) => a - b).map(idx => CARD_DECK[idx]);
  const lines = items.map(c => `- [${c.artist}] ${c.title}`);
  document.getElementById('output').value = lines.join('\n') || '（沒有標記任何要刪除的）';
  document.getElementById('output-count').textContent = items.length;
  document.getElementById('output-panel').style.display = 'block';
  document.getElementById('output-panel').scrollIntoView({ behavior: 'smooth' });
};

document.getElementById('btn-copy').onclick = async () => {
  const ta = document.getElementById('output');
  ta.select();
  try {
    await navigator.clipboard.writeText(ta.value);
    document.getElementById('btn-copy').textContent = '已複製 ✓';
    setTimeout(() => { document.getElementById('btn-copy').textContent = '複製'; }, 1500);
  } catch (e) { document.execCommand('copy'); }
};

populateFilter();
renderGrid();
</script>
