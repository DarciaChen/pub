<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>唸給我聽 · 文字朗讀</title>
<style>
  :root{
    --ink:#181620;
    --panel:#211e29;
    --line:#3a3645;
    --paper:#f3ecd9;
    --paper-dim:#b9b2a0;
    --amber:#d6a24e;
    --rose:#c97b84;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(900px 500px at 20% -10%, rgba(201,123,132,0.10), transparent 60%),
      radial-gradient(900px 600px at 100% 0%, rgba(214,162,78,0.08), transparent 60%),
      var(--ink);
    color:var(--paper);
    font-family:-apple-system, "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:28px 16px;
  }
  .card{
    width:100%;
    max-width:480px;
  }
  .eyebrow{
    font-size:12px;
    letter-spacing:0.18em;
    color:var(--amber);
    text-transform:uppercase;
    font-family:Georgia, "Times New Roman", serif;
    margin:0 0 6px 2px;
  }
  h1{
    font-family:Georgia, "Noto Serif TC", serif;
    font-weight:600;
    font-size:28px;
    margin:0 0 18px 2px;
    letter-spacing:0.01em;
  }
  .wave{
    display:flex;
    align-items:flex-end;
    gap:4px;
    height:28px;
    margin:0 2px 16px;
  }
  .wave span{
    flex:1;
    background:linear-gradient(180deg, var(--rose), var(--amber));
    border-radius:3px;
    height:18%;
    transition:height 0.15s ease;
  }
  .wave.speaking span{
    animation:bounce 0.9s ease-in-out infinite;
  }
  .wave span:nth-child(2){animation-delay:0.08s}
  .wave span:nth-child(3){animation-delay:0.16s}
  .wave span:nth-child(4){animation-delay:0.24s}
  .wave span:nth-child(5){animation-delay:0.32s}
  .wave span:nth-child(6){animation-delay:0.4s}
  .wave span:nth-child(7){animation-delay:0.48s}
  .wave span:nth-child(8){animation-delay:0.56s}
  @keyframes bounce{
    0%, 100%{height:18%}
    50%{height:90%}
  }
  textarea{
    width:100%;
    min-height:160px;
    resize:vertical;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:10px;
    color:var(--paper);
    font-size:16px;
    line-height:1.6;
    padding:16px;
    font-family:inherit;
    outline:none;
  }
  textarea:focus{border-color:var(--amber);}
  textarea::placeholder{color:var(--paper-dim);}
  .row{
    display:flex;
    gap:10px;
    margin-top:14px;
  }
  select{
    flex:1;
    background:var(--panel);
    border:1px solid var(--line);
    color:var(--paper);
    border-radius:8px;
    padding:10px 12px;
    font-size:14px;
    font-family:inherit;
  }
  .sliders{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
    margin-top:14px;
  }
  .slider-group label{
    display:flex;
    justify-content:space-between;
    font-size:12px;
    color:var(--paper-dim);
    margin-bottom:6px;
  }
  .slider-group span{color:var(--amber);}
  input[type=range]{
    width:100%;
    accent-color:var(--amber);
  }
  .importRow{
    display:flex;
    align-items:center;
    gap:10px;
    margin:0 2px 14px;
  }
  #importBtn{
    background:var(--panel);
    border:1px solid var(--line);
    color:var(--paper);
    border-radius:8px;
    padding:10px 14px;
    font-size:14px;
    font-family:inherit;
    cursor:pointer;
    white-space:nowrap;
  }
  #importBtn:active{transform:scale(0.98);}
  .fileName{
    font-size:12px;
    color:var(--paper-dim);
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .book{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:10px;
    margin-bottom:14px;
    overflow:hidden;
  }
  .bookHeader{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:10px 14px;
    border-bottom:1px solid var(--line);
  }
  .bookTitle{
    font-family:Georgia, "Noto Serif TC", serif;
    font-size:15px;
    color:var(--amber);
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .closeBook{
    background:transparent;
    border:none;
    color:var(--paper-dim);
    font-size:13px;
    cursor:pointer;
    padding:4px 6px;
  }
  .bookContent{
    max-height:280px;
    overflow-y:auto;
    padding:16px 18px;
    font-family:Georgia, "Noto Serif TC", serif;
    line-height:1.85;
    font-size:16px;
  }
  .bookContent h1, .bookContent h2, .bookContent h3{
    color:var(--amber);
    margin:0.8em 0 0.4em;
    line-height:1.4;
  }
  .bookContent h1{font-size:1.3em;}
  .bookContent h2{font-size:1.15em;}
  .bookContent h3{font-size:1.05em;}
  .bookContent p{margin:0 0 0.9em;}
  .bookContent li{margin-bottom:0.4em;}
  .bookContent .para{
    border-radius:6px;
    padding:2px 6px;
    margin:0 -6px;
    transition:background 0.25s ease;
  }
  .bookContent .para.active{
    background:rgba(214,162,78,0.18);
  }
  .bookNav{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    padding:10px 14px;
    border-top:1px solid var(--line);
  }
  .bookNav button{
    background:transparent;
    border:1px solid var(--line);
    color:var(--paper);
    border-radius:8px;
    padding:8px 12px;
    font-size:13px;
    font-family:inherit;
    cursor:pointer;
  }
  .bookNav button:disabled{opacity:0.35; cursor:not-allowed;}
  .paraCount{
    font-size:12px;
    color:var(--paper-dim);
  }
  .actions{
    display:flex;
    gap:10px;
    margin-top:18px;
  }
  button{
    flex:1;
    border:none;
    border-radius:10px;
    padding:14px;
    font-size:16px;
    font-weight:600;
    cursor:pointer;
    font-family:inherit;
    transition:transform 0.08s ease, opacity 0.2s ease;
  }
  button:active{transform:scale(0.98);}
  #speak{
    background:linear-gradient(135deg, var(--amber), var(--rose));
    color:#211524;
  }
  #stop{
    background:transparent;
    border:1px solid var(--line);
    color:var(--paper-dim);
  }
  button:disabled{opacity:0.4; cursor:not-allowed;}
  .status{
    margin-top:12px;
    font-size:12px;
    color:var(--paper-dim);
    min-height:16px;
    text-align:center;
  }
  :focus-visible{outline:2px solid var(--amber); outline-offset:2px;}
  @media (prefers-reduced-motion: reduce){
    .wave.speaking span{animation:none; height:50%;}
  }
</style>
</head>
<body>

<div class="card">
  <p class="eyebrow">Text → Voice</p>
  <h1>唸給我聽</h1>

  <div class="wave" id="wave">
    <span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span>
  </div>

  <div class="importRow">
    <button id="importBtn" type="button">📄 匯入 MD 檔</button>
    <input type="file" id="fileInput" accept=".md,.markdown,text/markdown,text/plain" hidden>
    <span class="fileName" id="fileName"></span>
  </div>

  <div class="book" id="book" hidden>
    <div class="bookHeader">
      <span class="bookTitle" id="bookTitle"></span>
      <button id="closeBook" type="button" class="closeBook">✕ 關閉</button>
    </div>
    <div class="bookContent" id="bookContent"></div>
    <div class="bookNav">
      <button id="prevPara" type="button">‹ 上一段</button>
      <span class="paraCount" id="paraCount"></span>
      <button id="nextPara" type="button">下一段 ›</button>
    </div>
  </div>

  <textarea id="text" placeholder="貼上或輸入想要朗讀的文字……，或匯入 MD 檔"></textarea>

  <div class="row">
    <select id="voice"></select>
  </div>

  <div class="sliders">
    <div class="slider-group">
      <label>速度 <span id="rateVal">1.0</span></label>
      <input type="range" id="rate" min="0.5" max="1.8" step="0.1" value="1.0">
    </div>
    <div class="slider-group">
      <label>音調 <span id="pitchVal">1.0</span></label>
      <input type="range" id="pitch" min="0.5" max="1.8" step="0.1" value="1.0">
    </div>
  </div>

  <div class="actions">
    <button id="speak">▶ 開始朗讀</button>
    <button id="stop" disabled>■ 停止</button>
  </div>

  <p class="status" id="status">正在載入可用的語音……</p>
</div>

<script>
const synth = window.speechSynthesis;
const textEl = document.getElementById('text');
const voiceEl = document.getElementById('voice');
const rateEl = document.getElementById('rate');
const pitchEl = document.getElementById('pitch');
const rateVal = document.getElementById('rateVal');
const pitchVal = document.getElementById('pitchVal');
const speakBtn = document.getElementById('speak');
const stopBtn = document.getElementById('stop');
const statusEl = document.getElementById('status');
const waveEl = document.getElementById('wave');

let voices = [];
let pollTries = 0;

// 常見女聲關鍵字（中文與英文系統皆涵蓋），用來把最可能的女聲排到清單最前面
const femaleHints = [
  'female','women','girl','samantha','victoria','susan','karen','moira','tessa',
  'ting-ting','tingting','mei-jia','meijia','yating','ya-ting','sin-ji','hanhan',
  'han han','xiaoxiao','xiaoyi','婷婷','美佳','雅婷','曉曉','曉伊','慧'
];

function scoreVoice(v){
  const n = v.name.toLowerCase();
  return femaleHints.some(h => n.includes(h)) ? 0 : 1;
}

if (!('speechSynthesis' in window)){
  statusEl.textContent = '此瀏覽器不支援語音朗讀功能，請換成 Safari 或 Chrome 開啟';
  speakBtn.disabled = true;
}

function populateVoices(){
  voices = synth.getVoices();
  if (!voices.length){
    // 部分瀏覽器（尤其手機）載入語音清單較慢，輪詢重試最多 5 秒
    if (pollTries < 10){
      pollTries++;
      setTimeout(populateVoices, 500);
    } else {
      statusEl.textContent = '找不到可用語音，請確認瀏覽器設定或換瀏覽器再試';
    }
    return;
  }

  // 中文優先，其餘語言排後面；同語言內，可能的女聲排前面
  const sorted = [...voices].sort((a, b) => {
    const aZh = a.lang.toLowerCase().startsWith('zh') ? 0 : 1;
    const bZh = b.lang.toLowerCase().startsWith('zh') ? 0 : 1;
    if (aZh !== bZh) return aZh - bZh;
    return scoreVoice(a) - scoreVoice(b);
  });

  voiceEl.innerHTML = '';
  sorted.forEach((v) => {
    const opt = document.createElement('option');
    opt.value = v.name;
    opt.textContent = `${v.name} (${v.lang})`;
    voiceEl.appendChild(opt);
  });

  statusEl.textContent = `已載入 ${voices.length} 個語音，預設選用最接近的中文女聲`;
}

synth.onvoiceschanged = populateVoices;
populateVoices();

rateEl.addEventListener('input', () => rateVal.textContent = rateEl.value);
pitchEl.addEventListener('input', () => pitchVal.textContent = pitchEl.value);

function setSpeakingUI(isSpeaking){
  speakBtn.disabled = isSpeaking;
  stopBtn.disabled = !isSpeaking;
  waveEl.classList.toggle('speaking', isSpeaking);
  statusEl.textContent = isSpeaking ? '朗讀中……' : '已停止';
}

// 把文字切成一句一句：句末標點（。！？.!?；;）切大句，逗號類（，,、）切小停頓
function splitIntoClauses(text){
  const pieces = text.split(/([。！？.!?；;]+)/);
  const clauses = [];
  for (let i = 0; i < pieces.length; i += 2){
    const body = pieces[i];
    const punct = pieces[i + 1] || '';
    const combined = (body + punct).trim();
    if (!combined) continue;
    // 句尾標點代表大停頓，否則（被逗號等切開的）算小停頓
    const isSentenceEnd = /[。！？.!?；;]/.test(punct);
    clauses.push({ text: combined, pause: isSentenceEnd ? 320 : 120 });
  }
  return clauses.length ? clauses : [{ text, pause: 0 }];
}

function jitter(value, amount){
  // 在 value 附近做 ±amount 的隨機浮動，模擬真人說話的速度/音調不完全勻一
  const delta = (Math.random() * 2 - 1) * amount;
  return Math.max(0.5, Math.min(2, value + delta));
}

// ===== MD 匯入 · 電子書閱讀區 =====
const importBtn = document.getElementById('importBtn');
const fileInput = document.getElementById('fileInput');
const fileNameEl = document.getElementById('fileName');
const bookEl = document.getElementById('book');
const bookTitleEl = document.getElementById('bookTitle');
const bookContentEl = document.getElementById('bookContent');
const closeBookBtn = document.getElementById('closeBook');
const prevParaBtn = document.getElementById('prevPara');
const nextParaBtn = document.getElementById('nextPara');
const paraCountEl = document.getElementById('paraCount');

// 書本模式狀態：段落陣列（純文字，供朗讀用）與目前段落索引
let bookParas = [];      // [{ text, el }]
let bookIndex = 0;
let bookMode = false;

// 極簡 Markdown 解析：只處理標題(#)、清單(-/*)、粗體/斜體、其餘視為段落
// 目的是排版呈現，不追求完整 CommonMark 相容
function parseMarkdown(md){
  const lines = md.replace(/\r\n/g, '\n').split('\n');
  const blocks = []; // { type: 'h1'|'h2'|'h3'|'p'|'li', text }
  let paragraphBuf = [];

  function flushParagraph(){
    if (paragraphBuf.length){
      blocks.push({ type: 'p', text: paragraphBuf.join(' ').trim() });
      paragraphBuf = [];
    }
  }

  lines.forEach(raw => {
    const line = raw.trim();
    if (!line){ flushParagraph(); return; }
    const h = line.match(/^(#{1,3})\s+(.*)$/);
    if (h){
      flushParagraph();
      blocks.push({ type: 'h' + h[1].length, text: h[2].trim() });
      return;
    }
    const li = line.match(/^[-*]\s+(.*)$/);
    if (li){
      flushParagraph();
      blocks.push({ type: 'li', text: li[1].trim() });
      return;
    }
    paragraphBuf.push(line);
  });
  flushParagraph();
  return blocks;
}

// 去除殘留的 md 語法標記（粗體/斜體/行內程式碼/連結），只留下純文字給朗讀與顯示用
function stripInline(text){
  return text
    .replace(/`([^`]+)`/g, '$1')
    .replace(/\*\*([^*]+)\*\*/g, '$1')
    .replace(/\*([^*]+)\*/g, '$1')
    .replace(/__([^_]+)__/g, '$1')
    .replace(/_([^_]+)_/g, '$1')
    .replace(/\[([^\]]+)\]\([^)]+\)/g, '$1');
}

function renderBook(filename, md){
  const blocks = parseMarkdown(md);
  bookTitleEl.textContent = filename;
  bookContentEl.innerHTML = '';
  bookParas = [];

  let listBuf = null;
  function flushList(){
    if (listBuf){ bookContentEl.appendChild(listBuf); listBuf = null; }
  }

  blocks.forEach(b => {
    const clean = stripInline(b.text);
    if (!clean) return;

    if (b.type === 'li'){
      if (!listBuf){ listBuf = document.createElement('ul'); }
      const li = document.createElement('li');
      li.className = 'para';
      li.textContent = clean;
      listBuf.appendChild(li);
      bookParas.push({ text: clean, el: li });
      return;
    }
    flushList();

    const tag = (b.type === 'h1' || b.type === 'h2' || b.type === 'h3') ? b.type : 'p';
    const el = document.createElement(tag);
    el.className = 'para';
    el.textContent = clean;
    bookContentEl.appendChild(el);
    bookParas.push({ text: clean, el });
  });
  flushList();

  bookMode = true;
  bookIndex = 0;
  bookEl.hidden = false;
  updateBookNav();
  highlightPara(bookIndex);
}

function highlightPara(i){
  bookParas.forEach((p, idx) => p.el.classList.toggle('active', idx === i));
  if (bookParas[i]) bookParas[i].el.scrollIntoView({ block: 'center', behavior: 'smooth' });
}

function updateBookNav(){
  paraCountEl.textContent = bookParas.length ? `第 ${bookIndex + 1} / ${bookParas.length} 段` : '';
  prevParaBtn.disabled = bookIndex <= 0;
  nextParaBtn.disabled = bookIndex >= bookParas.length - 1;
}

importBtn.addEventListener('click', () => fileInput.click());

fileInput.addEventListener('change', () => {
  const file = fileInput.files[0];
  if (!file) return;
  fileNameEl.textContent = file.name;
  const reader = new FileReader();
  reader.onload = () => {
    renderBook(file.name.replace(/\.(md|markdown|txt)$/i, ''), reader.result);
    statusEl.textContent = `已匯入《${file.name}》，共 ${bookParas.length} 段，可逐段朗讀`;
  };
  reader.onerror = () => {
    statusEl.textContent = '讀取檔案失敗，請確認檔案格式';
  };
  reader.readAsText(file, 'UTF-8');
});

closeBookBtn.addEventListener('click', () => {
  bookMode = false;
  bookEl.hidden = true;
  bookParas = [];
  fileNameEl.textContent = '';
  fileInput.value = '';
});

function speakBookPara(i){
  if (i < 0 || i >= bookParas.length) return;
  bookIndex = i;
  updateBookNav();
  highlightPara(i);
  synth.cancel();
  queue = splitIntoClauses(bookParas[i].text);
  queueIndex = 0;
  playToken++;
  speakNext(playToken);
  setTimeout(() => { if (synth.paused) synth.resume(); }, 100);
}

prevParaBtn.addEventListener('click', () => speakBookPara(bookIndex - 1));
nextParaBtn.addEventListener('click', () => speakBookPara(bookIndex + 1));

let queue = [];
let queueIndex = 0;
let playToken = 0;

function speakNext(token){
  if (token !== playToken) return; // 使用者已按停止或重新開始，這個播放序列作廢
  if (queueIndex >= queue.length){
    setSpeakingUI(false);
    return;
  }
  const clause = queue[queueIndex];
  const baseRate = parseFloat(rateEl.value);
  const basePitch = parseFloat(pitchEl.value);

  const utter = new SpeechSynthesisUtterance(clause.text);
  const chosen = voices.find(v => v.name === voiceEl.value);
  if (chosen){
    utter.voice = chosen;
    utter.lang = chosen.lang;
  }
  utter.rate = jitter(baseRate, 0.06);
  utter.pitch = jitter(basePitch, 0.08);

  utter.onstart = () => setSpeakingUI(true);
  utter.onerror = (e) => {
    setSpeakingUI(false);
    statusEl.textContent = '朗讀失敗（' + (e.error || '未知錯誤') + '），請改用 Safari/Chrome 開啟此頁面';
  };
  utter.onend = () => {
    queueIndex++;
    if (queueIndex >= queue.length && bookMode && bookIndex < bookParas.length - 1){
      // 書本模式：這一段唸完，自動接續下一段
      setTimeout(() => speakBookPara(bookIndex + 1), clause.pause + 200);
      return;
    }
    setTimeout(() => speakNext(token), clause.pause);
  };

  synth.speak(utter);
}

speakBtn.addEventListener('click', () => {
  if (bookMode && bookParas.length){
    speakBookPara(bookIndex);
    return;
  }
  const text = textEl.value.trim();
  if (!text){
    statusEl.textContent = '請先輸入文字，或匯入 MD 檔';
    return;
  }
  synth.cancel();

  queue = splitIntoClauses(text);
  queueIndex = 0;
  playToken++;

  speakNext(playToken);

  // 部分行動瀏覽器在頁面閒置一段時間後會暫停語音佇列，主動喚醒一次
  setTimeout(() => { if (synth.paused) synth.resume(); }, 100);
});

stopBtn.addEventListener('click', () => {
  playToken++; // 讓正在排程的下一句失效
  synth.cancel();
  setSpeakingUI(false);
});
</script>

</body>
</html>
